<script>

let auditorName = "";
let userAnswers = {};

const chapterOrder = [
    'chapter-0',
    'chapter-0-5',
    'chapter-1',
    'chapter-2',
    'chapter-3',
    'chapter-4',
    'chapter-5',
    'chapter-6',
    'chapter-7',
    'chapter-8'
];

const correctAnswers = {
    q1: 'C',
    q2: 'C',
    q3: 'B',
    q4: 'A',
    q5: 'D',
    q6: 'A',
    q7: 'C'
};

const questionChapterMap = {
    q1: 'chapter-2',
    q2: 'chapter-3',
    q3: 'chapter-4',
    q4: 'chapter-5',
    q5: 'chapter-6',
    q6: 'chapter-7'
};

let highestUnlockedIndex = 0;

function updateProgress(cardId) {
    const index = chapterOrder.indexOf(cardId);
    const progress = (index / (chapterOrder.length - 1)) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
}

function goToCard(cardId) {

    const requestedIndex = chapterOrder.indexOf(cardId);

    if (requestedIndex < highestUnlockedIndex) {
        return;
    }

    if (requestedIndex > highestUnlockedIndex) {
        highestUnlockedIndex = requestedIndex;
    }

    document.querySelectorAll('.card').forEach(card => {
        card.classList.remove('active');
    });

    document.getElementById(cardId).classList.add('active');

    updateProgress(cardId);

    window.scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

function startInvestigation() {

    const nameInput = document.getElementById('auditorName').value.trim();

    if (!nameInput) {
        alert('Please enter your name to begin the assessment.');
        return;
    }

    auditorName = nameInput;

    goToCard('chapter-0-5');
}

function checkAnswer(questionId, selected, isCorrect) {

    if (userAnswers[questionId]) {
        return;
    }

    userAnswers[questionId] = selected;

    const container =
        document.getElementById(questionId + '-options');

    const buttons =
        container.querySelectorAll('.option-btn');

    const feedback =
        document.getElementById(questionId + '-feedback');

    buttons.forEach(btn => {

        btn.disabled = true;

        if (btn.innerText.startsWith(selected)) {

            if (isCorrect) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('incorrect');
            }
        }

        if (
            !isCorrect &&
            btn.innerText.startsWith(correctAnswers[questionId])
        ) {
            btn.classList.add('correct');
        }
    });

    if (isCorrect) {

        feedback.className = 'feedback correct';

        feedback.innerText =
            'Correct. Proceeding to next chapter...';

    } else {

        feedback.className = 'feedback incorrect';

        feedback.innerText =
            'Answer recorded. Proceeding to next chapter...';
    }

    if (questionChapterMap[questionId]) {

        setTimeout(() => {
            goToCard(questionChapterMap[questionId]);
        }, 1500);
    }
}

function submitAudit() {

    goToCard('chapter-8');

    document.getElementById(
        'displayAuditorName'
    ).innerText = auditorName;

    let score = 0;

    Object.keys(correctAnswers).forEach(question => {

        if (
            userAnswers[question] ===
            correctAnswers[question]
        ) {
            score++;
        }
    });
